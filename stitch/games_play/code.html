<style>
        /* Immersive Underwater Background */
        body {
            background-color: #f9f9f9;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .ocean-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(155, 243, 223, 0.4) 0%, rgba(0, 107, 88, 0.15) 100%);
            z-index: -2;
        }

        .ocean-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.6;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .blob-1 {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, var(--tw-colors-secondary-container) 0%, transparent 70%);
        }

        .blob-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--tw-colors-primary-container) 0%, transparent 70%);
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 5%) scale(1.05); }
            100% { transform: translate(-5%, -2%) scale(0.95); }
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 107, 88, 0.05);
        }

        .pearl-shadow {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 8px 24px rgba(0, 107, 88, 0.1);
        }

        .inner-glow {
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Sudoku Grid Specifics */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px;
            border-radius: 1rem;
        }
        
        .sudoku-block {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(0, 107, 88, 0.1);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .sudoku-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sudoku-cell:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.95);
        }

        .sudoku-cell.prefilled {
            color: var(--tw-colors-primary);
            font-weight: 600;
        }

        .sudoku-cell.user-filled {
            color: var(--tw-colors-secondary);
        }
    </style>
