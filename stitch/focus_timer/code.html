<style>

            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .timer-circle.running {
            box-shadow: inset 0 2px 15px rgba(255,255,255,0.9), 0 0 60px rgba(56, 222, 187, 0.2);
            border-color: rgba(100, 255, 218, 0.4);
        }

            background: radial-gradient(circle at center, #e8f5e9 0%, #b2dfdb 100%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 w-full max-w-4xl mx-auto px-6 py-20 mt-16 md:mt-0">

<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-md" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="rgba(255,255,255,0.3)" stroke-width="2"></circle>
<circle class="progress-ring__circle" cx="50" cy="50" fill="none" id="progress-ring" r="48" stroke="#38debb" stroke-dasharray="301.59" stroke-dashoffset="0" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- The Pearl -->
<div class="timer-circle w-[90%] h-[90%] rounded-full flex flex-col items-center justify-center shadow-pearl relative z-10 cursor-pointer group" id="pearl-container">
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/5 to-transparent opacity-50"></div>
<div class="font-display-lg text-display-lg text-on-surface font-light tracking-tighter relative z-20 group-hover:scale-105 transition-transform duration-300" id="time-display">
                    25:00
                </div>
<button class="mt-4 font-label-sm text-label-sm text-primary flex items-center gap-1 opacity-60 hover:opacity-100 transition-opacity z-20 bg-white/30 px-3 py-1 rounded-full backdrop-blur-sm border border-white/40">
<span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
                    Duration
                </button>
</div>

<!-- Controls -->
<div class="mt-16 flex items-center gap-6 z-20">
<button class="w-14 h-14 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:bg-white/60 hover:shadow-bubble transition-all duration-300 active:scale-95" id="reset-btn">
<span class="material-symbols-outlined" data-icon="replay">replay</span>
</button>
<button class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:shadow-xl hover:bg-primary/90 hover:scale-105 transition-all duration-300 active:scale-95 relative overflow-hidden" id="play-pause-btn">
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent"></div>
<span class="material-symbols-outlined text-3xl" data-icon="play_arrow" data-weight="fill" id="play-icon" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-14 h-14 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:bg-white/60 hover:shadow-bubble transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined" data-icon="skip_next">skip_next</span>
</button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timeDisplay = document.getElementById('time-display');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const resetBtn = document.getElementById('reset-btn');
            const pearlContainer = document.getElementById('pearl-container');
            const progressRing = document.getElementById('progress-ring');
            
            const radius = progressRing.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
            progressRing.style.strokeDashoffset = circumference;
            // Initially full
            progressRing.style.strokeDashoffset = 0;

            let isRunning = false;
            let totalTime = 25 * 60; // 25 minutes in seconds
            let timeLeft = totalTime;
            let timerInterval;

            function updateDisplay() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                const offset = circumference - (timeLeft / totalTime) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }

            function toggleTimer() {
                if (isRunning) {
                    clearInterval(timerInterval);
                    playIcon.textContent = 'play_arrow';
                    playIcon.setAttribute('data-icon', 'play_arrow');
                    pearlContainer.classList.remove('running');
                } else {
                    timerInterval = setInterval(() => {
                        if (timeLeft > 0) {
                            timeLeft--;
                            updateDisplay();
                        } else {
                            clearInterval(timerInterval);
                            isRunning = false;
                            playIcon.textContent = 'play_arrow';
                            pearlContainer.classList.remove('running');
                            // Add finish logic here
                        }
                    }, 1000);
                    playIcon.textContent = 'pause';
                    playIcon.setAttribute('data-icon', 'pause');
                    pearlContainer.classList.add('running');
                }
                isRunning = !isRunning;
            }

            function resetTimer() {
                clearInterval(timerInterval);
                isRunning = false;
                timeLeft = totalTime;
                updateDisplay();
                playIcon.textContent = 'play_arrow';
                playIcon.setAttribute('data-icon', 'play_arrow');
                pearlContainer.classList.remove('running');
            }

            playPauseBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', resetTimer);
            
            // Allow clicking the pearl to start/stop
            pearlContainer.addEventListener('click', (e) => {
                // Don't trigger if clicking the edit button
                if(!e.target.closest('button')) {
                    toggleTimer();
                }
            });

            // Initialize
            updateDisplay();
        });
    </script>
