<style>
        /* Organic Animations for the Aquarium */
        @keyframes float Gentle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        @keyframes floatSlight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes swimSlow {
            0% { transform: translate(-10vw, 0) scaleX(-1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(110vw, -20px) scaleX(-1); opacity: 0; }
        }
        @keyframes swimReverse {
            0% { transform: translate(110vw, 0) scaleX(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(-10vw, 30px) scaleX(1); opacity: 0; }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(238,232,180,0.5), inset 0 -4px 12px rgba(0,0,0,0.1); }
            50% { box-shadow: 0 0 40px rgba(238,232,180,0.9), inset 0 -4px 12px rgba(0,0,0,0.1); }
        }
        @keyframes riseBubble {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .animate-float { animation: float Gentle 8s ease-in-out infinite; }
        .animate-float-slight { animation: floatSlight 6s ease-in-out infinite; }
        .animate-swim-1 { animation: swimSlow 45s linear infinite; }
        .animate-swim-2 { animation: swimReverse 60s linear infinite 15s; }
        .animate-pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
        
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border: 1px solid rgba(255,255,255,0.3);

<script>
        // Simple ambient interactions
        document.addEventListener('mousemove', (e) => {
            const bubbles = document.querySelectorAll('.bubble');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            bubbles.forEach((bubble, index) => {
                const speed = (index + 1) * 2;
                bubble.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
