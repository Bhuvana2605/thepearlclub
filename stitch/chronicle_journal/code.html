<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Pearl Club - Chronicle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#00201b",
                        "inverse-primary": "#38debb",
                        "inverse-surface": "#2f3131",
                        "surface-container-high": "#e8e8e8",
                        "on-tertiary-fixed-variant": "#4b4822",
                        "surface-container-highest": "#e2e2e2",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#7fd6c3",
                        "primary": "#006b58",
                        "on-tertiary-fixed": "#1e1c00",
                        "primary-fixed": "#5ffbd6",
                        "secondary-container": "#9bf3df",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "surface-dim": "#dadada",
                        "outline": "#6b7a75",
                        "inverse-on-surface": "#f1f1f1",
                        "on-background": "#1a1c1c",
                        "on-primary-container": "#007560",
                        "tertiary-fixed-dim": "#cdc897",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bacac3",
                        "tertiary-container": "#eee8b4",
                        "surface-bright": "#f9f9f9",
                        "secondary": "#006b5c",
                        "surface-variant": "#e2e2e2",
                        "on-secondary-fixed-variant": "#005045",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#9bf3df",
                        "on-surface-variant": "#3c4a45",
                        "surface-container": "#eeeeee",
                        "primary-fixed-dim": "#38debb",
                        "on-tertiary-container": "#6c683e",
                        "tertiary-fixed": "#eae4b1",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f3f3",
                        "primary-container": "#64ffda",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#005142",
                        "on-primary": "#ffffff",
                        "surface-tint": "#006b58",
                        "surface": "#f9f9f9",
                        "tertiary": "#636037",
                        "background": "#f9f9f9",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#002019",
                        "on-secondary-container": "#017162"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "bubble-margin": "4rem",
                        "organic-padding": "1.5rem",
                        "float-gap": "2rem",
                        "safe-area": "2.5rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .pearl-glow {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 0 20px rgba(95, 251, 214, 0.2);
        }
        .text-cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        body {
            background: linear-gradient(135deg, #f3f3f3 0%, #e2e2e2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-on-background overflow-x-hidden relative">
<!-- Top Navigation (Desktop) -->
<header class="hidden md:flex fixed top-0 w-full justify-between items-center px-organic-padding pt-safe-area z-50 bg-transparent no-border flat no shadows transition-all duration-500 ease-in-out">
<div class="font-display-lg text-display-lg text-primary tracking-tight">The Pearl Club</div>
<nav class="flex gap-8">
<span class="text-on-surface-variant font-headline-md text-headline-md hover:scale-105 transition-transform cursor-pointer">Eye</span>
<span class="text-on-surface-variant font-headline-md text-headline-md hover:scale-105 transition-transform cursor-pointer">Focus</span>
<span class="text-on-surface-variant font-headline-md text-headline-md hover:scale-105 transition-transform cursor-pointer">Games</span>
<span class="text-on-surface-variant font-headline-md text-headline-md hover:scale-105 transition-transform cursor-pointer">Aquarium</span>
</nav>
<div class="flex gap-4 text-primary">
<span class="material-symbols-outlined text-3xl hover:scale-105 transition-transform cursor-pointer" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content Area -->
<main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center p-organic-padding pb-32 md:pb-organic-padding pt-24 md:pt-32">
<div class="w-full max-w-3xl glass-panel rounded-xl p-8 md:p-12 flex flex-col gap-8 relative overflow-hidden">
<!-- Decorative subtle glow -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
<!-- Header -->
<div class="flex flex-col items-center justify-center text-center gap-2">
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Thursday, October 12, 2023</p>
<h1 class="font-headline-lg text-headline-lg text-primary">Chronicle</h1>
</div>
<!-- Writing Area -->
<div class="flex-grow w-full mt-4">
<textarea class="w-full h-64 md:h-96 bg-transparent border-none resize-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant p-0 overflow-y-auto leading-relaxed" placeholder="Let your thoughts flow like water..."></textarea>
<div class="h-[2px] w-full bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50 mt-2"></div>
</div>
<!-- Controls -->
<div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-6 md:gap-0">
<div class="flex items-center gap-4 w-full md:w-auto justify-center md:justify-start">
<button class="p-2 rounded-full hover:bg-white/20 transition-colors flex items-center justify-center text-outline">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<span class="font-label-sm text-label-sm text-outline">Oct 11</span>
<button class="p-2 rounded-full hover:bg-white/20 transition-colors flex items-center justify-center text-outline">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<div class="flex items-center gap-2 font-label-sm text-label-sm text-outline-variant">
<span class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse"></span>
                    Autosaved
                </div>
</div>
<!-- Mood Canvas Prompt -->
<div class="mt-8 flex justify-center">
<button class="px-6 py-3 rounded-full bg-white/30 hover:bg-white/50 backdrop-blur-md border border-white/40 shadow-sm text-primary font-body-md text-body-md flex items-center gap-3 transition-all duration-300 hover:-translate-y-1 pearl-glow">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
                    Want to express it visually? Open Mood Canvas
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation (Mobile) -->
<nav class="md:hidden fixed bottom-safe-area left-0 w-full px-bubble-margin flex justify-between items-end z-50 bg-transparent no-border flat transition-all duration-500 ease-in-out">
<div class="flex justify-between w-full relative">
<div class="flex flex-col items-center gap-1 group">
<div class="bg-white/20 backdrop-blur-md text-on-surface-variant rounded-full p-4 group-hover:translate-y-[-4px] transition-transform">
<span class="material-symbols-outlined" data-icon="checklist">checklist</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">To-Do</span>
</div>
<div class="flex flex-col items-center gap-1 group">
<div class="bg-secondary-container text-on-secondary-container rounded-full p-4 shadow-[inset_0_2px_4px_rgba(255,255,255,0.8)] group-hover:translate-y-[-4px] transition-transform animate-pulse">
<span class="material-symbols-outlined" data-icon="edit_note" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Journal</span>
</div>
<div class="flex flex-col items-center gap-1 group">
<div class="bg-white/20 backdrop-blur-md text-on-surface-variant rounded-full p-4 group-hover:translate-y-[-4px] transition-transform">
<span class="material-symbols-outlined" data-icon="music_note">music_note</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Music</span>
</div>
<div class="flex flex-col items-center gap-1 group">
<div class="bg-white/20 backdrop-blur-md text-on-surface-variant rounded-full p-4 group-hover:translate-y-[-4px] transition-transform">
<span class="material-symbols-outlined" data-icon="self_care">self_care</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Help</span>
</div>
</div>
</nav>
<!-- Floating Background Elements -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[20%] left-[10%] w-32 h-32 bg-primary-container/20 rounded-full blur-2xl animate-[float_10s_ease-in-out_infinite]"></div>
<div class="absolute bottom-[30%] right-[15%] w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl animate-[float_15s_ease-in-out_infinite_reverse]"></div>
</div>
<style>
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
    </style>
</body></html>
