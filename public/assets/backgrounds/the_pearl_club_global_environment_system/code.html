<script>
        const ENVIRONMENTS = {
            'ocean': 'url("https://lh3.googleusercontent.com/aida/AEtjO1UeU80EVoyVuL80UICADjG_-_lv40-kKeobS9wPEpmjv9PAqluozutu3jKpJL2Tiv08kNrX9Dl4GLrpKR9Z8gycfN_3ztrW65t7dN9zhBsea_D57RTSmAE0L8XFx7pwtakB5bexP1463c4L10LbjCWqyyizvUQK8XEZAowRkGscRakMjKAfRQWkw7SzapXj0qxfWEaNPl6UtjfM9vudEHanxkuFBptdhGUVQcUI_XPyZdTNEvGsv8OBTGw")',
            'rainy-ocean': 'url("https://lh3.googleusercontent.com/aida/AEtjO1VIMUJxmqUYJNCCYS32WInu17wPEoIhwswkDU3DV8937rxcgTYXOQ5SKGYF3PB8evbjlte9is4Zf0QvLWBurLzQfbtgyfUJoDUOSVC94DjMJETO8o3o0NVEU_GHPRZQvIo0y-qxH1rtEi8pI4SsFU2KUY5kB99V3FSyv_0dCMD8RmVl5Pxc7-tH3gwyGx3E6vXYCOJhmdCFb7cOXva5WqTX073pcabUEAZl_NjGFWpuul2VPMLeRleok8c")',
            'underwater': 'url("https://lh3.googleusercontent.com/aida/AEtjO1UmbunBv6luqoxRzwj4ESlIPaG9hf9PxEGNJveEDelewEYCdgzM6jv7W-bvCxn3j_uh14E2D0St2dpjSV84kc0bcYkx9pC7RIMVpY8smqhckWFBYQ2R56vop42r85VmEw2AHEr2iFXa6i0np36vKcKLb4SuIdhEzLOHQCY4eUKak6M_9Epocg_NcLOpGimIhn3gC4gXCNibmaWfyGkTerjgdq07m69DobEbmMXeaFVF9M1PRY9L1E7T2Nw")',
            'beach': 'url("https://lh3.googleusercontent.com/aida/AEtjO1WcPKJ3QAJhcfk50RD2iuev401wCS7s88UbTlpIL2L4GrP6SX7LRUDkkYVcfJw8ejc3tKPnRqsYptIMsT6pWxb9HzTqriG9sWa7_SrgK3kRKq3sMe0FNRWSJZR9kCCzxG5__S9_FwvqGFOMW16ij6ia7BAs75v349MHUBvfwme9iTNwF_lZKRvMB9qExVBpOtC3N8daiM1D7KYcSzeo0GRw3yXBwRhsahUTgTEOnDgJ2ZamWb-h61QCxM8")',
            'sunset-beach': 'url("https://lh3.googleusercontent.com/aida/AEtjO1XCkUAjVRFVI_16wo7RQnDoFTVzefUsxGJkvKpcUEeJd2m2KTx42FApWhmTvLHpeRbaH3be-Ztsm05tX70w_zwMnX6eiNZN6z2xvrf5f9sj2nefMIRaEBAdjvyepvx_G-ig0a_kIql690E0e9mcs4ILBGWgJ8pjPd0U4WQah2YnAnGkI-hrMizPosxTFx5HbxVyVY7I8pdPSDHGUd1SMaVM3xXzJVCkd1aGnZyPGuqX6cQa6R3HGinLaGI")',
            'grassland': 'url("https://lh3.googleusercontent.com/aida/AEtjO1WCBa0FdyYwIDIt5DO1vJLOPSxfMlYik29JzJIHApdoIQU7-N0N8ro_l735LJg-3V6C6T5rxQd7yaAHzEVwiLHCh9Pgu5_QqAA64wsHYDK7e4eT3EPuMby-MMRxyIY3a9upYEhKPzgVQCqhdQuDy8cRMpFKzV0dVuq5qMn0vsidwo6M_Hi6fAhJRqwAIbU1G_M_iTgDVt8SbpZD_pb9H8kikna5JbCGCVVxwtsC6823HcJtTwQauqrFY0M")'
        };

        function setEnvironment(envKey) {
            if (!ENVIRONMENTS[envKey]) envKey = 'ocean'; // Default
            
            // Persist
            localStorage.setItem('selectedEnvironment', envKey);
            
            // Apply background
            const bgElement = document.getElementById('env-background');
            if (bgElement) {
                bgElement.style.backgroundImage = ENVIRONMENTS[envKey];
            }

            // Update active state in modal
            document.querySelectorAll('#env-selector-grid button').forEach(btn => {
                if (btn.dataset.env === envKey) {
                    btn.classList.add('border-primary', 'bg-primary-container/20');
                    btn.classList.remove('border-outline-variant');
                } else {
                    btn.classList.remove('border-primary', 'bg-primary-container/20');
                    btn.classList.add('border-outline-variant');
                }
            });
        }

        // Initialize Environment Provider Logic
        function initEnvironment() {
            const savedEnv = localStorage.getItem('selectedEnvironment') || 'ocean';
            setEnvironment(savedEnv);

            // Bind selectors
            document.querySelectorAll('#env-selector-grid button').forEach(btn => {
                btn.addEventListener('click', () => {
                    setEnvironment(btn.dataset.env);
                });
            });
            
            // Modal logic
            const modal = document.getElementById('env-modal');
            const openBtn = document.getElementById('env-settings-btn');
            const closeBtn = document.getElementById('env-close-btn');

            openBtn.addEventListener('click', () => {
                modal.classList.remove('hidden');
            });
            
            closeBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.add('hidden');
            });
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'pm' : 'am';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('clock').textContent = hours + ':' + minutes;
            
            const greetingEl = document.getElementById('greeting');
            const hour = now.getHours();
            if (hour < 12) {
                greetingEl.textContent = 'Good morning';
            } else if (hour < 18) {
                greetingEl.textContent = 'Good afternoon';
            } else {
                greetingEl.textContent = 'Good evening';
            }
        }
        
        setInterval(updateClock, 1000);
        updateClock();
        
        // Boot environment on load
        document.addEventListener('DOMContentLoaded', initEnvironment);
    </script>
