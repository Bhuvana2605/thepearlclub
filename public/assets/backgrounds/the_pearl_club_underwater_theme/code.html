<style>
        .glass-panel {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Floating animation for aquatic feel */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .bg-underwater {
            background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1UmbunBv6luqoxRzwj4ESlIPaG9hf9PxEGNJveEDelewEYCdgzM6jv7W-bvCxn3j_uh14E2D0St2dpjSV84kc0bcYkx9pC7RIMVpY8smqhckWFBYQ2R56vop42r85VmEw2AHEr2iFXa6i0np36vKcKLb4SuIdhEzLOHQCY4eUKak6M_9Epocg_NcLOpGimIhn3gC4gXCNibmaWfyGkTerjgdq07m69DobEbmMXeaFVF9M1PRY9L1E7T2Nw');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>

<body class="bg-underwater text-on-surface min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Top App Bar (Web & Mobile Context) -->
<header class="fixed top-0 w-full flex justify-between items-center px-organic-padding pt-safe-area z-50 bg-transparent transition-all duration-500 ease-in-out w-full top-0 left-0">
<div class="flex items-center gap-4">
<span class="font-display-lg text-display-lg text-white tracking-tight drop-shadow-md">The Pearl Club</span>
</div>
<div class="flex items-center gap-4">
<button class="hover:scale-105 transition-transform p-2 rounded-full glass-panel text-white">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[120px] pb-32 px-safe-area md:px-0 md:max-w-[900px] mx-auto min-h-screen flex flex-col items-center justify-center relative z-10">
<div class="text-center mb-12 animate-float">
<h1 class="font-display-lg text-display-lg text-white mb-4 drop-shadow-lg">Sanctuary</h1>
<p class="font-body-lg text-body-lg text-white/90">Deep Water</p>
</div>
<!-- Glassmorphism Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl mt-8">
<!-- Focus Card -->
<div class="glass-panel rounded-xl p-8 flex flex-col items-center justify-center gap-4 animate-float" style="animation-delay: 0.5s;">
<div class="w-20 h-20 rounded-full bg-primary-container/30 flex items-center justify-center shadow-inner-glow">
<span class="material-symbols-outlined text-[40px] text-white" style="font-variation-settings: 'FILL' 1;">center_focus_strong</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-white">Focus</h2>
<p class="font-body-md text-body-md text-white/80 text-center">Find your center in the stillness.</p>
</div>
<!-- Aquarium Card -->
<div class="glass-panel rounded-xl p-8 flex flex-col items-center justify-center gap-4 animate-float" style="animation-delay: 1s;">
<div class="w-20 h-20 rounded-full bg-secondary-container/30 flex items-center justify-center shadow-inner-glow">
<span class="material-symbols-outlined text-[40px] text-white" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-white">Aquarium</h2>
<p class="font-body-md text-body-md text-white/80 text-center">Immerse in tranquil depths.</p>
</div>
</div>
<!-- Floating Particles Effect Layer -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-1/4 left-1/4 w-4 h-4 rounded-full bg-white/20 blur-[2px] animate-float" style="animation-duration: 8s;"></div>
<div class="absolute top-3/4 left-1/3 w-6 h-6 rounded-full bg-secondary-fixed/20 blur-[3px] animate-float" style="animation-duration: 12s; animation-delay: 2s;"></div>
<div class="absolute top-1/2 right-1/4 w-3 h-3 rounded-full bg-primary-fixed/30 blur-[1px] animate-float" style="animation-duration: 7s; animation-delay: 1s;"></div>
<div class="absolute bottom-1/4 right-1/3 w-8 h-8 rounded-full bg-white/10 blur-[4px] animate-float" style="animation-duration: 15s; animation-delay: 3s;"></div>
</div>
</main>
<!-- Side Nav Bar (Web Context) -->
<nav class="hidden md:flex fixed right-8 flex-col gap-4 z-50 bg-surface-container/40 backdrop-blur-xl fixed right-float-gap top-1/2 -translate-y-1/2 rounded-full py-organic-padding border border-white/20 shadow-bubble-margin shadow-primary/5">
<button class="hover:bg-white/30 transition-colors text-on-surface-variant p-3 rounded-full flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">visibility</span>
<span class="font-label-sm text-label-sm text-white/70 group-hover:text-white">Eye</span>
</button>
<!-- Active Tab -->
<button class="hover:bg-white/30 transition-colors bg-primary-container text-on-primary-container rounded-full p-3 flex flex-col items-center gap-1 group Active: scale-90 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">center_focus_strong</span>
<span class="font-label-sm text-label-sm">Focus</span>
</button>
<button class="hover:bg-white/30 transition-colors text-on-surface-variant p-3 rounded-full flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">videogame_asset</span>
<span class="font-label-sm text-label-sm text-white/70 group-hover:text-white">Games</span>
</button>
<button class="hover:bg-white/30 transition-colors text-on-surface-variant p-3 rounded-full flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">water_drop</span>
<span class="font-label-sm text-label-sm text-white/70 group-hover:text-white">Aquarium</span>
</button>
</nav>
<!-- Bottom Nav Bar (Mobile Context) -->
<nav class="md:hidden fixed bottom-safe-area left-0 w-full px-bubble-margin flex justify-between items-end z-50 bg-transparent docked full-width bottom-0">
<div class="glass-panel w-full rounded-[2rem] px-6 py-4 flex justify-between items-center mx-4">
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">checklist</span>
</button>
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">edit_note</span>
</button>
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">music_note</span>
</button>
<!-- Central Active Action (Settings roughly maps to Focus/Sanctuary conceptually here as main) -->
<button class="bg-secondary-container text-on-secondary-container rounded-full p-4 shadow-inner-glow hover:translate-y-[-4px] transition-transform -translate-y-4 shadow-lg Active: animate-pulse">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">self_care</span>
</button>
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">palette</span>
</button>
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">sailing</span>
</button>
<button class="hover:translate-y-[-4px] transition-transform flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</nav>
