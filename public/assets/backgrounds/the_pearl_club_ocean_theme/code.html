<script>
        // Simple live clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            const strTime = hours + ':' + minutes + ' ' + ampm;
            document.getElementById('live-clock').textContent = strTime;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Ambient bubbles generation
        const bubbleContainer = document.getElementById('bubble-container');
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('ambient-bubble');
            
            const size = Math.random() * 20 + 5; // 5px to 25px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            bubble.style.left = `${Math.random() * 100}vw`;
            bubble.style.animationDuration = `${Math.random() * 5 + 8}s`; // 8s to 13s
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            
            bubbleContainer.appendChild(bubble);
            
            // Remove after animation completes to prevent DOM bloat
            setTimeout(() => {
                bubble.remove();
            }, 15000);
        }

        // Initially create some bubbles
        for(let i=0; i<15; i++) {
            setTimeout(createBubble, Math.random() * 5000);
        }
        
        // Continue creating bubbles periodically
        setInterval(createBubble, 1500);
    </script>
